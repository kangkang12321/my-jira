<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Clone - 项目管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="app">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <h1 class="text-2xl font-bold text-blue-600">Jira Clone</h1>
                    </div>
                    <nav class="flex items-center space-x-4">
                        <button onclick="showLogin()" class="px-4 py-2 text-gray-600 hover:text-gray-900">登录</button>
                        <button onclick="showRegister()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">注册</button>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Login Modal -->
        <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
            <div class="bg-white rounded-lg p-8 max-w-md w-full">
                <h2 class="text-2xl font-bold mb-6">登录</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                        <input type="email" id="loginEmail" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <input type="password" id="loginPassword" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded hover:bg-blue-700">登录</button>
                </form>
                <button onclick="closeLogin()" class="mt-4 text-gray-600 hover:text-gray-900">取消</button>
            </div>
        </div>

        <!-- Register Modal -->
        <div id="registerModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
            <div class="bg-white rounded-lg p-8 max-w-md w-full">
                <h2 class="text-2xl font-bold mb-6">注册</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                        <input type="text" id="regUsername" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                        <input type="email" id="regEmail" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <input type="password" id="regPassword" class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded hover:bg-blue-700">注册</button>
                </form>
                <button onclick="closeRegister()" class="mt-4 text-gray-600 hover:text-gray-900">取消</button>
            </div>
        </div>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <div id="dashboard" class="hidden">
                <h2 class="text-3xl font-bold mb-2">我的项目</h2>
                <p class="text-gray-600 mb-6">管理和跟踪你的所有项目</p>

                <button onclick="showCreateProject()" class="mb-6 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    + 创建项目
                </button>

                <div id="projectList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Projects will be rendered here -->
                </div>
            </div>

            <div id="welcome" class="text-center py-12">
                <h2 class="text-3xl font-bold mb-4">欢迎使用 Jira Clone</h2>
                <p class="text-gray-600 mb-6">登录或注册开始管理你的项目</p>
            </div>
        </main>
    </div>

    <script>
        // Mock data
        let projects = [];
        let currentUser = null;

        // Modal functions
        function showLogin() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLogin() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('registerModal').classList.remove('hidden');
        }

        function closeRegister() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        function showCreateProject() {
            const name = prompt('项目名称:');
            if (name) {
                const description = prompt('项目描述 (可选):');
                createProject(name, description);
            }
        }

        // Auth functions
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            // Mock login
            currentUser = {
                id: 1,
                email: email,
                username: email.split('@')[0]
            };

            closeLogin();
            showDashboard();
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            // Mock register
            currentUser = {
                id: 1,
                email: email,
                username: username
            };

            closeRegister();
            showDashboard();
        }

        // Project functions
        function createProject(name, description) {
            const project = {
                id: Date.now(),
                key: name.substring(0, 3).toUpperCase() + Math.floor(Math.random() * 100),
                name: name,
                description: description || '',
                created_at: new Date().toISOString()
            };

            projects.push(project);
            renderProjects();
        }

        function deleteProject(id) {
            if (confirm('确定删除这个项目吗？')) {
                projects = projects.filter(p => p.id !== id);
                renderProjects();
            }
        }

        function renderProjects() {
            const container = document.getElementById('projectList');

            if (projects.length === 0) {
                container.innerHTML = `
                    <div class="col-span-3 text-center py-12">
                        <p class="text-gray-500 text-lg">暂无项目</p>
                        <p class="text-gray-400 text-sm mt-2">点击上方按钮创建你的第一个项目</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = projects.map(project => `
                <div class="bg-white border border-gray-200 rounded-lg p-6 hover:shadow-md transition-shadow">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <span class="text-xs font-mono bg-blue-100 text-blue-700 px-2 py-1 rounded">
                                ${project.key}
                            </span>
                            <h3 class="text-lg font-semibold text-gray-900 mt-2">${project.name}</h3>
                            ${project.description ? `<p class="text-gray-600 text-sm mt-1">${project.description}</p>` : ''}
                        </div>
                        <button onclick="deleteProject(${project.id})" class="text-red-600 hover:text-red-700 ml-2">×</button>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <p class="text-sm text-gray-500">创建于 ${new Date(project.created_at).toLocaleDateString('zh-CN')}</p>
                    </div>
                </div>
            `).join('');
        }

        function showDashboard() {
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('welcome').classList.add('hidden');
            document.querySelector('header nav').innerHTML = `
                <span class="text-gray-700">欢迎, ${currentUser.username}</span>
                <button onclick="logout()" class="px-4 py-2 text-gray-600 hover:text-gray-900">退出</button>
            `;
            renderProjects();
        }

        function logout() {
            currentUser = null;
            projects = [];
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('welcome').classList.remove('hidden');
            document.querySelector('header nav').innerHTML = `
                <button onclick="showLogin()" class="px-4 py-2 text-gray-600 hover:text-gray-900">登录</button>
                <button onclick="showRegister()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">注册</button>
            `;
        }
    </script>
</body>
</html>
